<!DOCTYPE html>

<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DATE COIN FLIP</title>

<style>

* {

  margin: 0;

  padding: 0;

  box-sizing: border-box;

}

body {

  min-height: 100vh;

  background: radial-gradient(circle at top,#292929,#101010 50%,#050505);

  color: white;

  font-family: Arial,sans-serif;

  display: flex;

  justify-content: center;

  align-items: center;

  padding: 20px;

}

.container {

  width: 100%;

  max-width: 480px;

  text-align: center;

  background: rgba(20,20,20,.95);

  border: 1px solid #383838;

  border-radius: 25px;

  padding: 30px 22px;

  box-shadow: 0 0 50px #000;

  position: relative;

  overflow: hidden;

}

.container::before {

  content: "";

  position: absolute;

  top: 0;

  right: 15%;

  width: 70%;

  height: 2px;

  background: linear-gradient(90deg,transparent,gold,transparent);

}

.logo {

  font-size: 32px;

  font-weight: 900;

  letter-spacing: 8px;

  margin-bottom: 8px;

}

.subtitle {

  color: #888;

  font-size: 12px;

  letter-spacing: 3px;

  margin-bottom: 25px;

}

.clock {

  background: #101010;

  border: 1px solid #303030;

  border-radius: 12px;

  padding: 12px;

  margin-bottom: 30px;

}

#time {

  font-size: 23px;

  font-weight: bold;

  color: #e8c75a;

  direction: ltr;

}

#date {

  color: #888;

  font-size: 12px;

  margin-top: 6px;

}

h2 {

  font-size: 21px;

  margin-bottom: 8px;

}

.description {

  color: #888;

  font-size: 13px;

  margin-bottom: 20px;

}

/* COIN */

.coin-area {

  height: 220px;

  display: flex;

  justify-content: center;

  align-items: center;

  perspective: 1000px;

  margin-bottom: 15px;

}

.coin {

  width: 155px;

  height: 155px;

  position: relative;

  transform-style: preserve-3d;

  transition: transform 3s cubic-bezier(.15,.7,.15,1);

}

.side {

  position: absolute;

  width: 155px;

  height: 155px;

  border-radius: 50%;

  display: flex;

  flex-direction: column;

  justify-content: center;

  align-items: center;

  backface-visibility: hidden;

  border: 7px solid #aaa;

  box-shadow: inset 0 0 15px #ffffff55,0 0 25px #ffffff20;

}

.side span {

  font-size: 38px;

  font-weight: 900;

}

.side small {

  font-size: 13px;

  margin-top: 7px;

  font-weight: bold;

}

.silver {

  background: linear-gradient(135deg,#eee,#858585,#d5d5d5);

  color: #222;

  border-color: #aaa;

}

.gold {

  background: linear-gradient(135deg,#fff0a0,#d4a62d,#fff0a0);

  color: #513900;

  border-color: #e4bd4c;

  transform: rotateY(180deg);

}

.coin.flipping.silver-result {

  transform: rotateY(1800deg);

}

.coin.flipping.gold-result {

  transform: rotateY(1980deg);

}

/* BUTTON */

.flip-btn {

  width: 100%;

  padding: 16px;

  border: none;

  border-radius: 13px;

  background: linear-gradient(135deg,#f6d66a,#b88b20);

  color: #17120a;

  font-size: 17px;

  font-weight: 900;

  cursor: pointer;

  transition: .3s;

}

.flip-btn:hover {

  transform: translateY(-3px);

  box-shadow: 0 5px 25px #d9ad3d66;

}

.flip-btn:disabled {

  opacity: .5;

  cursor: not-allowed;

}

#cooldown {

  display: none;

  color: #e8c75a;

  margin-top: 15px;

  font-size: 14px;

  font-weight: bold;

}

/* RESULT */

.result {

  display: none;

  margin-top: 23px;

  padding: 20px 12px;

  border-radius: 15px;

  animation: appear .5s ease;

}

.result.win {

  background: #33290e;

  border: 1px solid #d6ae42;

  box-shadow: 0 0 25px #d6ae4222;

}

.result.lose {

  background: #242424;

  border: 1px solid #666;

}

.result h3 {

  font-size: 23px;

  margin-bottom: 10px;

}

.result p {

  color: #ccc;

  font-size: 13px;

  line-height: 1.9;

}

/* DISCORD */

.discord {

  display: block;

  margin-top: 15px;

  padding: 14px;

  background: #5865f2;

  color: white;

  text-decoration: none;

  border-radius: 10px;

  font-weight: bold;

  transition: .3s;

}

.discord:hover {

  background: #4752c4;

  transform: scale(1.02);

}

.footer {

  margin-top: 28px;

  color: #555;

  font-size: 11px;

  letter-spacing: 2px;

}

@keyframes appear {

  from {

    opacity: 0;

    transform: translateY(12px);

  }

  to {

    opacity: 1;

    transform: translateY(0);

  }

}

@media(max-width:400px) {

  .container {

    padding: 25px 16px;

  }

}

</style>

</head>

<body>

<div class="container">

  <div class="logo">D A T E</div>

  <div class="subtitle">COIN FLIP CHALLENGE</div>

  <div class="clock">

    <div id="time">00:00:00</div>

    <div id="date">جاري تحميل التاريخ...</div>

  </div>

  <h2>🪙 تحدي رمي العملة</h2>

  <p class="description">

    ارمي العملة واختبر حظك للفوز مع DATE

  </p>

  <div class="coin-area">

    <div class="coin" id="coin">

      <div class="side silver">

        <span>✦</span>

        <small>SILVER</small>

      </div>

      <div class="side gold">

        <span>★</span>

        <small>GOLD</small>

      </div>

    </div>

  </div>

  <button class="flip-btn" id="flipBtn" onclick="flipCoin()">

    🪙 ارمي العملة

  </button>

  <div id="cooldown"></div>

  <div class="result" id="result">

    <h3 id="resultTitle"></h3>

    <p id="resultText"></p>

    <a class="discord"

       id="discordBtn"

       href="https://discord.gg/6aa"

       target="_blank"

       rel="noopener"

       style="display:none">

       دخول سيرفر DATE

    </a>

  </div>

  <a class="discord"

     href="https://discord.gg/6aa"

     target="_blank"

     rel="noopener">

     💬 دخول سيرفر DATE

  </a>

  <div class="footer">

    DATE STORE © 2026

  </div>

</div>

<script>

const SERVER_LINK = "https://discord.gg/6aa";

const COOLDOWN = 10 * 60 * 1000;

const STORAGE_KEY = "DATE_LAST_COIN_FLIP";

let busy = false;

// الساعة والتاريخ

function updateClock() {

  const now = new Date();

  document.getElementById("time").textContent =

    now.toLocaleTimeString("ar-SA", {

      hour: "2-digit",

      minute: "2-digit",

      second: "2-digit",

      hour12: true,

      timeZone: "Asia/Riyadh"

    });

  document.getElementById("date").textContent =

    now.toLocaleDateString("ar-SA", {

      weekday: "long",

      year: "numeric",

      month: "long",

      day: "numeric",

      timeZone: "Asia/Riyadh"

    });

}

// حساب الوقت المتبقي

function getRemaining() {

  const last = Number(localStorage.getItem(STORAGE_KEY)) || 0;

  return Math.max(0, COOLDOWN - (Date.now() - last));

}

// تحديث العداد

function updateCooldown() {

  const remaining = getRemaining();

  const btn = document.getElementById("flipBtn");

  const cooldown = document.getElementById("cooldown");

  if (remaining > 0) {

    const minutes = Math.floor(remaining / 60000);

    const seconds = Math.floor((remaining % 60000) / 1000);

    cooldown.style.display = "block";

    cooldown.textContent =

      `⏳ المحاولة القادمة بعد: ${minutes}:${String(seconds).padStart(2,"0")}`;

    if (!busy) {

      btn.disabled = true;

      btn.textContent = "انتظر حتى تنتهي مدة الانتظار";

    }

  } else {

    cooldown.style.display = "none";

    if (!busy) {

      btn.disabled = false;

      btn.textContent = "🪙 ارمي العملة";

    }

  }

}

// رمي العملة

function flipCoin() {

  if (busy || getRemaining() > 0) {

    updateCooldown();

    return;

  }

  busy = true;

  const coin = document.getElementById("coin");

  const btn = document.getElementById("flipBtn");

  const result = document.getElementById("result");

  const title = document.getElementById("resultTitle");

  const text = document.getElementById("resultText");

  const discord = document.getElementById("discordBtn");

  // حفظ وقت المحاولة

  localStorage.setItem(STORAGE_KEY, Date.now().toString());

  btn.disabled = true;

  btn.textContent = "⏳ العملة تدور...";

  result.style.display = "none";

  result.className = "result";

  coin.className = "coin";

  // نسبة الفوز 15% والخسارة 85%

  const won = Math.random() < 0.15;

  setTimeout(() => {

    coin.classList.add("flipping");

    if (won) {

      coin.classList.add("gold-result");

    } else {

      coin.classList.add("silver-result");

    }

  }, 50);

  setTimeout(() => {

    if (won) {

      result.className = "result win";

      title.textContent = "🏆 مبروك! لقد فزت";

      text.textContent =

        "ظهرت لك الجهة الذهبية! تهانينا لك، تواصل مع إدارة DATE لاستلام جائزتك";

      discord.style.display = "block";

      discord.href = SERVER_LINK;

    } else {

      result.className = "result lose";

      title.textContent = "🩶 حظ أوفر!";

      text.textContent =

        "للأسف ظهرت لك الجهة الرصاصية، لا تستسلم وجرب حظك مرة أخرى بعد انتهاء وقت الانتظار";

      discord.style.display = "none";

    }

    result.style.display = "block";

    busy = false;

    updateCooldown();

  }, 3200);

}

// تشغيل الموقع

updateClock();

updateCooldown();

setInterval(updateClock, 1000);

setInterval(updateCooldown, 1000);

window.addEventListener("storage", updateCooldown);

</script>

</body>

</html>
